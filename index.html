<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fit + Nutri</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #222831;
      color: #EEEEEE;
    }

    header {
      background-color: #393E46;
      color: #EEEEEE;
      padding: 10px;
    }

    nav ul {
      list-style: none;
      padding: 0;
    }

    nav ul li {
      display: inline;
      margin: 10px;
    }

    nav ul li a {
      color: #00ADB5;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    nav ul li a:hover {
      color: #EEEEEE;
      transform: translateY(-3px);
    }

    .banner {
      background: url('banner.jpg') no-repeat center center/cover;
      padding: 50px 20px;
      color: white;
    }

    .banner h2 {
      font-size: 36px;
      font-family: 'Impact', 'Arial Black', sans-serif;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    .banner button {
      background-color: #00ADB5;
      color: #EEEEEE;
      padding: 10px 20px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px;
      transition: transform 0.3s ease;
    }

    .banner button:hover {
      background-color: #00949a;
      transform: scale(1.1);
    }

    .menu {
      margin: 20px;
    }

    .search-bar {
      margin-bottom: 20px;
    }

    .search-bar input {
      padding: 8px;
      border-radius: 5px;
      border: none;
      width: 200px;
    }

    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .item {
      border: 1px solid #393E46;
      padding: 10px;
      width: 200px;
      text-align: center;
      background: #393E46;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      animation: fadeInZoom 0.6s ease-in-out;
    }

    .item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.4s ease;
    }

    .item img:hover {
      transform: scale(1.05);
    }

    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .quantity-control button,
    .item button {
      background-color: #00ADB5;
      color: white;
      border: none;
      padding: 5px 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.3s ease;
    }

    .quantity-control button:hover,
    .item button:hover {
      background-color: #00949a;
      transform: scale(1.1);
    }

    .quantity-control span {
      font-size: 16px;
      width: 20px;
      display: inline-block;
      text-align: center;
      color: white;
    }

    footer {
      background-color: #393E46;
      color: #EEEEEE;
      padding: 10px;
      margin-top: 20px;
    }

    @keyframes fadeInZoom {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Healthy Friends </h1>
  <nav>
    <ul>
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a></li>
      <li><a href="order.html"><i class="fas fa-receipt"></i> Order</a></li>
    </ul>
  </nav>
</header>

<section class="banner">
  <h2>Your Ultimate Partner in Food</h2>
  <button onclick="window.location.href='cart.html'">View Cart</button>
</section>

<section class="menu">
  <h2>Popular Dishes</h2>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search food..." onkeyup="searchFood()" />
  </div>
  <div class="items" id="menuItems"></div>
</section>

<footer>
  <p>&copy; 2025 Food Order. All rights reserved.</p>
</footer>

<script>
  const items = [
    { name: 'Burger', price: 100, img: 'burger.jpg' },
    { name: 'Pizza', price: 250, img: 'pizza.jpg' },
    { name: 'Pasta', price: 180, img: 'pasta.jpg' },
    { name: 'French Fries', price: 90, img: 'fries.jpg' },
    { name: 'Sandwich', price: 120, img: 'sandwich.jpg' },
    { name: 'Biryani', price: 220, img: 'biryani.jpg' },
    { name: 'Momos', price: 150, img: 'momos.jpg' },
    { name: 'Dosa', price: 90, img: 'dosa.jpg' },
    { name: 'Noodles', price: 130, img: 'noodles.jpg' },
    { name: 'Ice Cream', price: 80, img: 'icecream.jpg' }
  ];

  let cart = JSON.parse(localStorage.getItem("cart")) || {};

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function addToCart(itemName, price) {
    cart[itemName] = { price: price, qty: 1 };
    saveCart();
    renderMenu(document.getElementById("searchInput").value); // re-render to show quantity buttons
  }

  function increaseQuantity(itemName) {
    if (cart[itemName]) {
      cart[itemName].qty += 1;
      saveCart();
      updateCartUI(itemName);
    }
  }

  function decreaseQuantity(itemName) {
    if (cart[itemName]) {
      cart[itemName].qty -= 1;
      if (cart[itemName].qty <= 0) {
        delete cart[itemName];
        renderMenu(document.getElementById("searchInput").value);
      } else {
        updateCartUI(itemName);
      }
      saveCart();
    }
  }

  function updateCartUI(itemName) {
    const span = document.getElementById(itemName.replace(/\s/g, "") + "-qty");
    if (span) {
      span.textContent = cart[itemName]?.qty || 0;
    }
  }

  function renderMenu(filter = "") {
    const container = document.getElementById("menuItems");
    container.innerHTML = "";
    items
      .filter(item => item.name.toLowerCase().includes(filter.toLowerCase()))
      .forEach(item => {
        const itemId = item.name.replace(/\s/g, "");
        const isInCart = cart[item.name];
        container.innerHTML += `
          <div class="item">
            <img src="${item.img}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p>₹${item.price}</p>
            ${
              isInCart
                ? `<div class="quantity-control" id="${itemId}-controls">
                    <button onclick="decreaseQuantity('${item.name}')">-</button>
                    <span id="${itemId}-qty">${cart[item.name].qty}</span>
                    <button onclick="increaseQuantity('${item.name}')">+</button>
                  </div>`
                : `<button onclick="addToCart('${item.name}', ${item.price})">Add</button>`
            }
          </div>
        `;
      });
  }

  function searchFood() {
    const input = document.getElementById("searchInput").value;
    renderMenu(input);
  }

  window.onload = () => {
    renderMenu();
  };
</script>

</body>
</html>
